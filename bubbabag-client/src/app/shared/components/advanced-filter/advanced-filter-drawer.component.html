<div
  *ngIf="visible"
  class="fixed inset-0 z-50 overflow-hidden bg-black/40 backdrop-blur-xs"
  (click)="close()"
>
  <div class="fixed inset-y-0 right-0 flex max-w-full pl-10">
    <div
      class="w-screen max-w-xl bg-white dark:bg-neutral-900 border-l border-neutral-200 dark:border-neutral-800 shadow-2xl flex flex-col animate-in slide-in-from-right duration-200"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-neutral-200 dark:border-neutral-800">
        <div>
          <h2 class="text-sm font-semibold text-neutral-900 dark:text-neutral-100">
            Editar filtros: {{ entidad || 'Filtros avanzados' }}
          </h2>
          <p class="text-xs text-neutral-500 dark:text-neutral-400 mt-0.5">
            Define condiciones lógicas para filtrar los registros de la tabla.
          </p>
        </div>
        <button
          type="button"
          (click)="close()"
          class="p-1 rounded text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-200 cursor-pointer"
        >
          <app-icon name="close" [size]="16" />
        </button>
      </div>

      <!-- Body -->
      <div class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
        <!-- Barra de acciones superior -->
        <div class="flex items-center justify-between pb-2 border-b border-neutral-100 dark:border-neutral-800">
          <div class="flex items-center gap-2">
            <span class="text-xs text-neutral-500 dark:text-neutral-400">Coincidir con:</span>
            <select
              [(ngModel)]="localGroup.logic"
              class="px-2 py-1 text-xs font-semibold rounded border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-neutral-800 dark:text-neutral-200 focus:outline-none focus:ring-1 focus:ring-primary-500"
            >
              <option value="AND">TODAS las reglas (Y)</option>
              <option value="OR">CUALQUIERA de las reglas (O)</option>
            </select>
          </div>

          <button
            type="button"
            (click)="onLimpiarTodo()"
            [disabled]="localGroup.conditions.length === 0"
            class="flex items-center gap-1.5 text-xs text-rose-600 dark:text-rose-400 hover:underline disabled:opacity-40 cursor-pointer"
          >
            <app-icon name="undo" [size]="13" />
            <span>Restablecer</span>
          </button>
        </div>

        <!-- Condiciones -->
        <div *ngIf="localGroup.conditions.length === 0" class="py-8 text-center">
          <div class="w-10 h-10 mx-auto rounded-full bg-neutral-100 dark:bg-neutral-800 flex items-center justify-center text-neutral-400 mb-2">
            <app-icon name="filter" [size]="20" />
          </div>
          <p class="text-xs text-neutral-500 dark:text-neutral-400 mb-3">
            No hay condiciones configuradas.
          </p>
          <button
            type="button"
            (click)="addCondition()"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md bg-primary-50 dark:bg-primary-950/60 text-primary-700 dark:text-primary-300 border border-primary-200 dark:border-primary-800/40 hover:bg-primary-100 cursor-pointer transition-colors"
          >
            <app-icon name="plus" [size]="14" />
            <span>Agregar primera regla</span>
          </button>
        </div>

        <div *ngIf="localGroup.conditions.length > 0" class="space-y-3">
          <div
            *ngFor="let cond of localGroup.conditions; let idx = index"
            class="p-3 rounded-lg border border-neutral-200 dark:border-neutral-800 bg-neutral-50/50 dark:bg-neutral-800/30 flex items-center gap-2 group"
          >
            <!-- Campo -->
            <select
              [(ngModel)]="cond.field"
              (ngModelChange)="onFieldChange(cond)"
              class="w-1/3 px-2.5 py-1.5 text-xs rounded border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-neutral-900 dark:text-neutral-100 focus:outline-none focus:ring-1 focus:ring-primary-500"
            >
              <option *ngFor="let col of availableColumns" [value]="col.key">
                {{ col.title }}
              </option>
            </select>

            <!-- Operador -->
            <select
              [(ngModel)]="cond.operator"
              (ngModelChange)="onOperatorChange(cond)"
              class="w-1/3 px-2.5 py-1.5 text-xs rounded border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-neutral-900 dark:text-neutral-100 focus:outline-none focus:ring-1 focus:ring-primary-500"
            >
              <option *ngFor="let op of getOperatorsForField(cond.field)" [value]="op.value">
                {{ op.label }}
              </option>
            </select>

            <!-- Valor -->
            <div class="flex-1">
              <ng-container *ngIf="isUnaryOperator(cond.field, cond.operator)">
                <span class="inline-block px-2 py-1 text-[11px] rounded bg-neutral-200 dark:bg-neutral-700 text-neutral-600 dark:text-neutral-300">
                  Sin valor requerido
                </span>
              </ng-container>

              <ng-container *ngIf="!isUnaryOperator(cond.field, cond.operator)">
                <input
                  type="text"
                  [(ngModel)]="cond.value"
                  placeholder="Valor..."
                  class="w-full px-2.5 py-1.5 text-xs rounded border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-neutral-900 dark:text-neutral-100 focus:outline-none focus:ring-1 focus:ring-primary-500"
                />
              </ng-container>
            </div>

            <!-- Botón Eliminar regla -->
            <button
              type="button"
              (click)="removeCondition(idx)"
              class="p-1.5 rounded text-neutral-400 hover:text-rose-600 dark:hover:text-rose-400 cursor-pointer transition-colors"
              title="Eliminar regla"
            >
              <app-icon name="trash" [size]="14" />
            </button>
          </div>

          <!-- Botón Agregar más reglas -->
          <div class="pt-2">
            <button
              type="button"
              (click)="addCondition()"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md border border-dashed border-neutral-300 dark:border-neutral-700 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-50 dark:hover:bg-neutral-800/60 cursor-pointer transition-colors"
            >
              <app-icon name="plus" [size]="14" />
              <span>Agregar regla</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="flex justify-end gap-2 px-6 py-3 border-t border-neutral-200 dark:border-neutral-800 bg-neutral-50/50 dark:bg-neutral-800/30">
        <button
          type="button"
          (click)="close()"
          class="px-4 py-1.5 text-xs font-medium rounded-md border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-700 dark:text-neutral-300 cursor-pointer transition-colors"
        >
          Cerrar
        </button>
        <button
          type="button"
          (click)="onAplicar()"
          class="px-4 py-1.5 text-xs font-medium rounded-md bg-primary-600 hover:bg-primary-700 text-white cursor-pointer transition-colors shadow-xs"
        >
          Aplicar filtros
        </button>
      </div>
    </div>
  </div>
</div>
