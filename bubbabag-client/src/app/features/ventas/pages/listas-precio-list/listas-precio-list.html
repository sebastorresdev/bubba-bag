<app-command-bar [items]="commandBarItems"></app-command-bar>

<div class="catalogo-view-wrapper">
  <app-entity-table
    entidad="Listas de Precios"
    [vistasSistema]="vistasSistema"
    [(vistaActualKey)]="vistaActual"
    [columnas]="columnas"
    [datos]="listasPrecioFiltradas"
    [loading]="loading"
    [(selectedIds)]="selectedIds"
    (selectedIdsChange)="onSelectedIdsChange($event)"
    (vistaChange)="onVistaChange($event)"
    (recargar)="cargarDatos()"
    (rowDblClick)="editar($event.id)"
  >
    <!-- Nombre -->
    <ng-template cellDef="nombre" let-item>
      <span class="nombre-link" (click)="editar(item.id)">
        {{ item.nombre }}
      </span>
    </ng-template>

    <!-- Moneda -->
    <ng-template cellDef="moneda" let-item>
      <span class="currency-badge">{{ item.moneda }}</span>
    </ng-template>

    <!-- Predeterminada -->
    <ng-template cellDef="esPredeterminada" let-item>
      <span class="flag-pill" [class.flag-yes]="item.esPredeterminada" [class.flag-no]="!item.esPredeterminada">
        {{ item.esPredeterminada ? 'Sí' : 'No' }}
      </span>
    </ng-template>

    <!-- Ítems Fijados -->
    <ng-template cellDef="totalItems" let-item>
      <nz-tag [nzColor]="item.totalItems > 0 ? 'blue' : 'default'">
        {{ item.totalItems }} tarifas
      </nz-tag>
    </ng-template>

    <!-- Estado -->
    <ng-template cellDef="activo" let-item>
      <span class="flag-pill" [class.flag-yes]="item.activo" [class.flag-no]="!item.activo">
        {{ item.activo ? 'Activa' : 'Inactiva' }}
      </span>
    </ng-template>
  </app-entity-table>
</div>
