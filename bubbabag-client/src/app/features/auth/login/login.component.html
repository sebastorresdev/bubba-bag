<div class="login-wrapper">
  <nz-card class="login-card" [nzBordered]="true">
    <div class="login-header">
      <h1 class="login-title">BubbaBag ERP</h1>
      <p class="login-subtitle">
        Ingresa con tu cuenta de administrador
      </p>
    </div>

    <form nz-form [formGroup]="loginForm" nzLayout="vertical" (ngSubmit)="submitForm()">
      <nz-form-item>
        <nz-form-control nzErrorTip="Por favor ingresa un correo válido!">
          <nz-input-group nzPrefixIcon="user" nzSize="large">
            <input type="email" nz-input formControlName="email" placeholder="Correo electrónico" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-control nzErrorTip="Por favor ingresa tu contraseña!">
          <nz-input-group nzPrefixIcon="lock" nzSize="large">
            <input type="password" nz-input formControlName="password" placeholder="Contraseña" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <div class="login-options">
        <label nz-checkbox formControlName="remember">
          <span>Recordarme</span>
        </label>
        <a class="login-forgot-link">Olvidé mi contraseña</a>
      </div>

      <button nz-button nzType="primary" nzSize="large" nzBlock>
        Iniciar Sesión
      </button>
    </form>
  </nz-card>
</div>
