<app-command-bar [items]="commandBarItems"></app-command-bar>

<div class="catalogo-view-wrapper">
  <app-entity-table
    entidad="Tipos de Orden de Trabajo"
    [vistasSistema]="vistasSistema"
    [(vistaActualKey)]="vistaActual"
    [columnas]="columnas"
    [datos]="tiposOrdenFiltrados"
    [loading]="loading"
    [(selectedIds)]="selectedIds"
    (selectedIdsChange)="onSelectedIdsChange($event)"
    (vistaChange)="onVistaChange($event)"
    (recargar)="cargarDatos()"
    (rowDblClick)="editar($event.id)"
  >
    <!-- Modalidad Operativa -->
    <ng-template cellDef="nombre" let-item>
      <span class="nombre-link" (click)="editar(item.id)">
        {{ item.nombre }}
      </span>
    </ng-template>

    <!-- Visita Campo -->
    <ng-template cellDef="requiereVisitaCampo" let-item>
      <span class="flag-pill" [class.flag-yes]="item.requiereVisitaCampo" [class.flag-no]="!item.requiereVisitaCampo">
        {{ item.requiereVisitaCampo ? 'Sí' : 'No' }}
      </span>
    </ng-template>

    <!-- Exige Firma -->
    <ng-template cellDef="exigeFirmaCliente" let-item>
      <span class="flag-pill" [class.flag-yes]="item.exigeFirmaCliente" [class.flag-no]="!item.exigeFirmaCliente">
        {{ item.exigeFirmaCliente ? 'Sí' : 'No' }}
      </span>
    </ng-template>

    <!-- Evidencias Foto -->
    <ng-template cellDef="exigeEvidenciasFotograficas" let-item>
      <span class="flag-pill" [class.flag-yes]="item.exigeEvidenciasFotograficas" [class.flag-no]="!item.exigeEvidenciasFotograficas">
        {{ item.exigeEvidenciasFotograficas ? 'Sí' : 'No' }}
      </span>
    </ng-template>

    <!-- Estado -->
    <ng-template cellDef="activo" let-item>
      <nz-tag [nzColor]="item.activo ? 'success' : 'default'">
        {{ item.activo ? 'Activo' : 'Inactivo' }}
      </nz-tag>
    </ng-template>
  </app-entity-table>
</div>
