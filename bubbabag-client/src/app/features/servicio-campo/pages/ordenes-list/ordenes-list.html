<app-command-bar [items]="commandBarItems"></app-command-bar>

<div class="ordenes-view-wrapper">
  <app-entity-table
    entidad="Órdenes de Trabajo"
    [vistasSistema]="vistasSistema"
    [(vistaActualKey)]="vistaActual"
    [columnas]="columnas"
    [datos]="ordenesFiltradas"
    [loading]="loading"
    [(selectedIds)]="selectedIds"
    (selectedIdsChange)="onSelectedIdsChange($event)"
    (vistaChange)="onVistaChange($event)"
    (recargar)="cargarDatos()"
    (rowDblClick)="editar($event.id)"
  >
    <!-- N° Orden -->
    <ng-template cellDef="numero" let-item>
      <span class="nombre-link" (click)="editar(item.id)">
        {{ item.numero }}
      </span>
    </ng-template>

    <!-- Técnico -->
    <ng-template cellDef="tecnico" let-item>
      <span>{{ item.tecnico || 'Sin asignar' }}</span>
    </ng-template>

    <!-- Prioridad -->
    <ng-template cellDef="prioridad" let-item>
      <nz-tag
        class="d365-priority-tag"
        [nzColor]="item.prioridad === 'Alta' ? 'red' : item.prioridad === 'Media' ? 'orange' : 'blue'"
      >
        {{ item.prioridad }}
      </nz-tag>
    </ng-template>

    <!-- Estado -->
    <ng-template cellDef="estado" let-item>
      <nz-tag
        class="d365-status-tag"
        [class.tag-active]="item.estado === 'Completada'"
        [class.tag-inactive]="item.estado === 'Cancelada'"
      >
        {{ item.estado }}
      </nz-tag>
    </ng-template>
  </app-entity-table>
</div>
