<app-command-bar [items]="commandBarItems"></app-command-bar>

<div class="p-4 flex flex-col gap-3">
  <app-entity-table
    entidad="Categorías de Producto"
    [vistasSistema]="vistasSistema"
    [(vistaActualKey)]="vistaActual"
    [columnas]="columnas"
    [datos]="categoriasFiltradas"
    [loading]="loading"
    [(selectedIds)]="selectedIds"
    (selectedIdsChange)="onSelectedIdsChange($event)"
    (vistaChange)="onVistaChange($event)"
    (recargar)="cargarDatos()"
    (rowDblClick)="abrirEditar($event)"
  >
    <!-- Nombre con link primario para editar -->
    <ng-template cellDef="nombre" let-item>
      <span
        class="font-medium text-primary-600 dark:text-primary-400 hover:underline cursor-pointer"
        (click)="abrirEditar(item)"
      >
        {{ item.nombre }}
      </span>
    </ng-template>

    <!-- Familia / Grupo -->
    <ng-template cellDef="familia" let-item>
      <span
        *ngIf="item.familia"
        class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[11px] font-medium bg-neutral-100 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 border border-neutral-200 dark:border-neutral-700/60"
      >
        <app-icon name="folder" [size]="12" svgClass="text-neutral-400" />
        {{ item.familia }}
      </span>
      <span *ngIf="!item.familia" class="text-xs text-neutral-400 dark:text-neutral-500 italic">
        Sin familia
      </span>
    </ng-template>

    <!-- Estado -->
    <ng-template cellDef="activo" let-item>
      <span
        [class]="item.activo
          ? 'inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/40'
          : 'inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-neutral-100 dark:bg-neutral-800 text-neutral-500'"
      >
        {{ item.activo ? 'Activo' : 'Inactivo' }}
      </span>
    </ng-template>
  </app-entity-table>
</div>
