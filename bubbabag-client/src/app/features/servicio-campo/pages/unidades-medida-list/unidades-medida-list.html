<app-command-bar [items]="commandBarItems"></app-command-bar>

<div class="p-4 flex flex-col gap-3">
  <app-entity-table
    entidad="Unidades de Medida"
    [vistasSistema]="vistasSistema"
    [(vistaActualKey)]="vistaActual"
    [columnas]="columnas"
    [datos]="unidadesFiltradas"
    [loading]="loading"
    [(selectedIds)]="selectedIds"
    (selectedIdsChange)="onSelectedIdsChange($event)"
    (vistaChange)="onVistaChange($event)"
    (recargar)="cargarDatos()"
    (rowDblClick)="abrirEditar($event)"
  >
    <!-- Código primario con link para editar -->
    <ng-template cellDef="codigo" let-item>
      <span
        class="font-mono text-xs font-semibold text-primary-600 dark:text-primary-400 hover:underline cursor-pointer"
        (click)="abrirEditar(item)"
      >
        {{ item.codigo }}
      </span>
    </ng-template>

    <!-- Nombre con link primario para editar -->
    <ng-template cellDef="nombre" let-item>
      <span
        class="font-medium text-primary-600 dark:text-primary-400 hover:underline cursor-pointer"
        (click)="abrirEditar(item)"
      >
        {{ item.nombre }}
      </span>
    </ng-template>

    <!-- Indicador de Control de Decimales -->
    <ng-template cellDef="permiteDecimales" let-item>
      <span
        *ngIf="item.permiteDecimales"
        class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[11px] font-medium bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800/40"
      >
        <app-icon name="check" [size]="12" />
        Permite Decimales
      </span>
      <span
        *ngIf="!item.permiteDecimales"
        class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium bg-neutral-100 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-400 border border-neutral-200 dark:border-neutral-700/60"
      >
        Solo Enteros
      </span>
    </ng-template>

    <!-- Estado -->
    <ng-template cellDef="activo" let-item>
      <span
        [class]="item.activo
          ? 'inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/40'
          : 'inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-neutral-100 dark:bg-neutral-800 text-neutral-500'"
      >
        {{ item.activo ? 'Activo' : 'Inactivo' }}
      </span>
    </ng-template>
  </app-entity-table>
</div>
