<app-command-bar [items]="commandBarItems" [farItems]="farItems"></app-command-bar>

<div class="p-4 flex flex-col gap-3">
  <app-entity-table
    entidad="Productos"
    [vistasSistema]="vistasSistema"
    [(vistaActualKey)]="vistaActual"
    [columnas]="columnas"
    [datos]="productosFiltrados"
    [loading]="loading"
    [scrollX]="'1300px'"
    [(selectedIds)]="setOfCheckedId"
    (selectedIdsChange)="onSelectedIdsChange($event)"
    (vistaChange)="onVistaChange($event)"
    (recargar)="cargarProductos()"
    (rowDblClick)="editarProducto($event.id)"
  >
    <!-- Código -->
    <ng-template cellDef="codigo" let-p>
      <a
        (click)="editarProducto(p.id)"
        class="font-mono text-xs font-semibold text-primary-600 dark:text-primary-400 hover:underline cursor-pointer"
        [title]="'Editar ' + p.codigo"
      >
        {{ p.codigo }}
      </a>
    </ng-template>

    <!-- Nombre -->
    <ng-template cellDef="nombre" let-p>
      <a
        (click)="editarProducto(p.id)"
        class="font-medium text-neutral-900 dark:text-neutral-100 hover:text-primary-600 dark:hover:text-primary-400 hover:underline cursor-pointer"
        [title]="p.nombre"
      >
        {{ p.nombre }}
      </a>
    </ng-template>

    <!-- Descripción -->
    <ng-template cellDef="descripcion" let-p>
      <span class="text-xs text-neutral-500 dark:text-neutral-400 truncate max-w-xs block" [title]="p.descripcion || ''">
        {{ p.descripcion || '—' }}
      </span>
    </ng-template>

    <!-- Categoría -->
    <ng-template cellDef="categoria" let-p>
      <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-neutral-100 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 border border-neutral-200 dark:border-neutral-700/60">
        {{ p.categoria }}
      </span>
    </ng-template>

    <!-- Tipo -->
    <ng-template cellDef="tipo" let-p>
      <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium bg-primary-50 dark:bg-primary-950/60 text-primary-700 dark:text-primary-300 border border-primary-200 dark:border-primary-800/40">
        <app-icon [name]="p.tipo === 'Inventario' ? 'box' : (p.tipo === 'Servicio' ? 'wrench' : 'tag')" [size]="12" />
        {{ getTipoLabel(p.tipo) }}
      </span>
    </ng-template>

    <!-- Unidad de Medida -->
    <ng-template cellDef="unidadMedida" let-p>
      <span class="text-xs text-neutral-700 dark:text-neutral-300 font-medium">
        {{ p.unidadMedida }}
      </span>
    </ng-template>

    <!-- Serializado -->
    <ng-template cellDef="esSerializado" let-p>
      <span
        *ngIf="p.esSerializado"
        class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-800/40"
      >
        Series
      </span>
      <span *ngIf="!p.esSerializado" class="text-neutral-400 dark:text-neutral-500">—</span>
    </ng-template>

    <!-- Precio Base -->
    <ng-template cellDef="precioBase" let-p>
      <span class="font-semibold text-xs text-neutral-900 dark:text-neutral-100">
        S/ {{ p.precioBase | number:'1.2-2' }}
      </span>
    </ng-template>

    <!-- Estado -->
    <ng-template cellDef="activo" let-p>
      <span
        [class]="p.activo
          ? 'inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/40'
          : 'inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-neutral-100 dark:bg-neutral-800 text-neutral-500'"
      >
        {{ p.activo ? 'Activo' : 'Inactivo' }}
      </span>
    </ng-template>
  </app-entity-table>
</div>
