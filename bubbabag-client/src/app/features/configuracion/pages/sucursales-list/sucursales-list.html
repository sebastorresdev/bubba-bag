<!-- Barra de Comandos Superior (Estilo Dynamics 365) -->
<app-command-bar [items]="commandBarItems" [farItems]="farItems"></app-command-bar>

<div class="catalogo-view-wrapper">
  <app-entity-table
    entidad="Sucursales"
    [vistasSistema]="vistasSistema"
    [(vistaActualKey)]="vistaActual"
    [columnas]="columnas"
    [datos]="sucursales"
    [loading]="loading"
    [(selectedIds)]="selectedIds"
    (selectedIdsChange)="onSelectedIdsChange($event)"
    (vistaChange)="onVistaChange($event)"
    (searchChange)="onBuscar($event)"
    (recargar)="cargarSucursales()"
    (rowDblClick)="irAEditar($event.id)"
  >
    <!-- Código -->
    <ng-template cellDef="codigo" let-s>
      <span class="d365-code-tag">{{ s.codigo }}</span>
    </ng-template>

    <!-- Nombre -->
    <ng-template cellDef="nombre" let-s>
      <span class="nombre-link" (click)="irAEditar(s.id)">
        <nz-icon nzType="bank" class="row-branch-icon" />
        <span class="truncate-text">{{ s.nombre }}</span>
      </span>
    </ng-template>

    <!-- Teléfono -->
    <ng-template cellDef="telefono" let-s>
      @if (s.telefono) {
        <span class="cell-ellipsis">{{ s.telefono }}</span>
      } @else {
        <span class="text-muted">—</span>
      }
    </ng-template>

    <!-- Tipo Sede -->
    <ng-template cellDef="esSedePrincipal" let-s>
      @if (s.esSedePrincipal) {
        <span class="d365-badge-sede-principal">
          <nz-icon nzType="star" nzTheme="fill" /> Principal
        </span>
      } @else {
        <span class="text-muted">Sucursal</span>
      }
    </ng-template>

    <!-- Estado -->
    <ng-template cellDef="activo" let-s>
      <nz-tag
        class="d365-status-tag"
        [class.tag-active]="s.activo"
        [class.tag-inactive]="!s.activo"
      >
        {{ s.activo ? 'Activo' : 'Inactivo' }}
      </nz-tag>
    </ng-template>
  </app-entity-table>
</div>
