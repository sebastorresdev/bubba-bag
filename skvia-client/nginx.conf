server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Tamaño máximo de subida para archivos de importación Excel y fotos de evidencia
    client_max_body_size 50M;

    # 1. Enrutamiento SPA (React Router fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy inverso hacia el Backend ASP.NET Core
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos para importaciones masivas de Siebel / Excel
        proxy_connect_timeout 90s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # 3. Cache optimizada para assets estáticos versionados
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 4. Nunca cachear index.html para asegurar actualizaciones inmediatas al desplegar
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Endpoint de verificación de salud para Docker / Balanceadores
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
